[project]
name = "smartres-ai-service"
version = "0.1.0"
description = "FastAPI AI service for SmartRes chatbot and upsell features"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.10.0"
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.8.0"]

[tool.uvicorn]
factory = false

